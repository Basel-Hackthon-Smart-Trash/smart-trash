name: smart-trash

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-trash-mosquitto
    restart: unless-stopped

    ports:
      - "${MQTT_PORT:-1883}:1883"

    volumes:
      - .code/mosquitto/config/mosquitto.conf:/code/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/code/mosquitto/data
      - mosquitto-log:/code/mosquitto/log

    networks:
      - smart-trash-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 5"
        ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

networks:
  smart-trash-network:
    name: smart-trash-network

volumes:
  mosquitto-data:
    name: smart-trash-mosquitto-data

  mosquitto-log:
    name: smart-trash-mosquitto-log