name: smart-trash

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-trash-mosquitto
    restart: unless-stopped

    ports:
      - "${MQTT_PORT:-1883}:1883"

    volumes:
      - .code/mosquitto/config/mosquitto.conf:/code/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/code/mosquitto/data
      - mosquitto-log:/code/mosquitto/log

    networks:
      - smart-trash-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 5"
        ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  timescaledb:
    image: "${TIMESCALEDB_IMAGE}"
    container_name: smart-trash-timescaledb
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      TIMESCALEDB_TELEMETRY: "off"

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - timescaledb-pg18-data:/var/lib/postgresql
      - ./code/database/init:/docker-entrypoint-initdb.d:ro

    networks:
      - smart-trash-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  smart-trash-network:
    name: smart-trash-network

volumes:
  mosquitto-data:
    name: smart-trash-mosquitto-data

  mosquitto-log:
    name: smart-trash-mosquitto-log

  timescaledb-pg18-data:
    name: smart-trash-timescaledb-pg18-data