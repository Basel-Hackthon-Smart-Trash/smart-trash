[project]
name = "smartbins"
version = "0.1.0"
description = "Smart Bins: fill-level prediction and sensor fault detection"
requires-python = ">=3.12,<3.16"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "smart-bin-routing",
]

[project.optional-dependencies]
streets = ["osmnx>=2.0"]

[tool.uv.sources]
# the team's routing package (code/routing), used unchanged
smart-bin-routing = { path = "../routing", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartbins"]
