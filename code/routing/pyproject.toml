[project]
name = "smart-bin-routing"
version = "0.1.0"
description = "Source-independent contracts and validation for smart-bin routing."
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "ortools>=9.12,<10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_bin_routing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
