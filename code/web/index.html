<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Trash · City dashboard</title>

  <!-- Leaflet (map library) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Same brand bar as the crew app (logo: assets/brand, white version in crew-app/brand) -->
  <header class="brandbar"><a href="../"><img src="../crew-app/brand/logo-light.svg" alt="Smart Trash · start page"></a></header>

  <aside class="sidebar">
    <h1>City dashboard</h1>
    <p class="data-badge" id="data-badge">Loading data…</p>

    <section>
      <h2>Today</h2>
      <ul class="summary" id="summary"></ul>
    </section>

    <section>
      <h2>Trucks today</h2>
      <div id="zone-filter"></div>
    </section>

    <section>
      <h2>Layers</h2>
      <label class="layer-toggle"><input type="checkbox" id="toggle-hotspots" checked><span class="row-text">Waste hotspots <small>real data · Basel open data</small></span></label>
    </section>

    <section>
      <h2>Legend</h2>
      <ul class="legend">
        <li><span class="dot red"></span>Empty today (90 % or full before tomorrow)</li>
        <li><span class="dot orange"></span>Also empty today (70–89 %)</li>
        <li><span class="dot green"></span>Skip</li>
        <li><span class="dot fault"></span>Sensor fault</li>
        <li><span class="dot depot"></span>Werkhof</li>
      </ul>
    </section>
  </aside>

  <main id="map"></main>

  <script src="map.js"></script>
</body>
</html>
