<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14231b">
  <title>Smart Trash Crew</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="brand">Smart Trash</div>
      <div class="crew" aria-label="Signed in team"><span class="crew-dot" aria-hidden="true"></span><span id="crew-name"></span></div>
    </header>

    <main id="screen-tour" class="screen">
      <section class="tour-head">
        <div>
          <p class="eyebrow"><span id="tour-date"></span> <span class="badge badge--data" id="data-label">SIMULATED</span></p>
          <h1 id="tour-name"></h1>
        </div>
        <div class="progress" aria-live="polite">
          <span class="progress-num" id="progress-num"></span>
          <span class="progress-label">done</span>
        </div>
      </section>
      <div class="progress-bar"><div id="progress-fill"></div></div>

      <div id="map" class="map" role="img" aria-label="Map of today's stops"></div>

      <section class="next" id="next-card"></section>

      <h2 class="section-title">Today's stops</h2>
      <ol class="stops" id="stops"></ol>

      <button class="btn add-bin" id="add-bin-btn" type="button">＋ Overflowing bin not on my list</button>
    </main>

    <main id="screen-done" class="screen" hidden>
      <div class="done">
        <div class="done-icon" aria-hidden="true">✓</div>
        <h1>Tour done</h1>
        <p id="done-summary"></p>
        <button class="btn btn--primary" type="button" id="restart-btn">Restart demo</button>
      </div>
    </main>

    <!-- Bottom sheet: content is filled by app.js -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>

    <div class="toast" id="toast" role="status" hidden>
      <span id="toast-text"></span>
      <button type="button" id="toast-undo">Undo</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
